# Backend PHP do staging (mesmo PHP-FPM :19001, root distinto)
server {
  listen 8080;
  listen [::]:8080;
  server_name staging.eskill.com.br;
  root /home/eskill/htdocs/staging.eskill.com.br/public;

  include /etc/nginx/global_settings;

  try_files $uri $uri/ /index.php?$args;
  index index.php index.html;

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors off;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "off";
    fastcgi_param SERVER_PORT 80;
    fastcgi_pass 127.0.0.1:19001;
    fastcgi_param PHP_VALUE "
error_log=/home/eskill/htdocs/staging.eskill.com.br/storage/logs/php-error.log;
memory_limit=512M;
max_execution_time=60;
max_input_time=60;
max_input_vars=10000;
post_max_size=64M;
upload_max_filesize=64M;
date.timezone=America/Sao_Paulo;
display_errors=off;";
  }

  location ~ /\.(ht|svn|git) {
    deny all;
  }
}
