# Staging isolado — staging.eskill.com.br
# Instalar: cp config/nginx/staging.eskill.com.br.conf /etc/nginx/sites-available/
#           ln -sf /etc/nginx/sites-available/staging.eskill.com.br.conf /etc/nginx/sites-enabled/
# TLS: após DNS apontar → certbot --nginx -d staging.eskill.com.br
#
# Arquitetura (espelha prod CloudWays):
#   Client → :80/:443 → proxy :8080 (Host staging) → PHP-FPM :19001
#   WS Pregão → :8092 (systemd pregao-ws-staging)

server {
  listen 80;
  listen [::]:80;
  server_name staging.eskill.com.br;

  location /.well-known/acme-challenge/ {
    root /home/eskill/htdocs/staging.eskill.com.br/public;
    default_type text/plain;
    try_files $uri =404;
  }

  # Enquanto não houver certificado, servir HTTP direto no backend.
  # Depois do certbot, trocar este bloco por return 301 https://$host$request_uri;
  location /ws/pregao {
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_connect_timeout 720;
    proxy_send_timeout 720;
    proxy_read_timeout 720;
  }
}

