[program:agent-runtime-monitor]
command=/usr/bin/php /home/eskill/htdocs/eskill.com.br/bin/agent-runtime-worker.php --loop --interval=300 --environment=production --max-attempts=2
directory=/home/eskill/htdocs/eskill.com.br
autostart=true
autorestart=true
startsecs=5
startretries=3
user=eskill
redirect_stderr=true
stdout_logfile=/home/eskill/htdocs/eskill.com.br/storage/logs/agent-runtime-monitor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopasgroup=true
killasgroup=true
stopwaitsecs=15
